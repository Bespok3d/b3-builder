name: Verified release context
description: Select a pre-tag preparation or bind publication to one exact approved artifact.
inputs:
  manifest-path:
    description: Caller-owned single-unit manifest, or empty for repository discovery
    default: ''
  tag-prefix:
    description: Caller-owned release tag prefix
    required: true
  prospective-tag:
    description: Exact future tag validated by the unchanged consumer guard
    default: ''
  selected-ids:
    description: Explicit unit selected for a preparation dispatch
    default: ''
  expected-source-sha:
    description: Exact checked-out commit required for dispatch
    default: ''
  release-kind:
    description: Requested tier, inferred from version on normal tag push
    default: ''
  publish:
    description: Dispatch publication requires an approved prepared receipt
    default: 'false'
  prepared-receipt:
    description: Exact prepared receipt JSON for a publication dispatch
    default: ''
  register-commit:
    description: Tested registration tooling SHA
    required: true
outputs:
  release-tag:
    description: release-tag
    value: ${{ steps.context.outputs.release-tag }}
  selected-ids:
    description: selected-ids
    value: ${{ steps.context.outputs.selected-ids }}
  release-kind:
    description: release-kind
    value: ${{ steps.context.outputs.release-kind }}
  publish:
    description: publish
    value: ${{ steps.context.outputs.publish }}
  prepared-only:
    description: prepared-only
    value: ${{ steps.context.outputs.prepared-only }}
  prepared-run-id:
    description: prepared-run-id
    value: ${{ steps.context.outputs.prepared-run-id }}
  prepared-artifact-id:
    description: prepared-artifact-id
    value: ${{ steps.context.outputs.prepared-artifact-id }}
  tool-root:
    description: tool-root
    value: ${{ steps.context.outputs.tool-root }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Resolve the exact release operation
      id: context
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        B3D_ACTION_PATH: ${{ github.action_path }}
        B3D_BUILDER_COMMIT: ${{ github.action_ref }}
        B3D_REGISTER_COMMIT: ${{ inputs.register-commit }}
        B3D_MANIFEST_PATH: ${{ inputs.manifest-path }}
        B3D_TAG_PREFIX: ${{ inputs.tag-prefix }}
        B3D_PROSPECTIVE_TAG: ${{ inputs.prospective-tag }}
        B3D_SELECTED_IDS: ${{ inputs.selected-ids }}
        B3D_EXPECTED_SOURCE: ${{ inputs.expected-source-sha }}
        B3D_RELEASE_KIND: ${{ inputs.release-kind }}
        B3D_PUBLISH: ${{ inputs.publish }}
        B3D_PREPARED_RECEIPT: ${{ inputs.prepared-receipt }}
      run: |
        set -euo pipefail
        tool_root="$(cd "$B3D_ACTION_PATH/../../.." && pwd)"
        (cd "$tool_root" && npm ci && npm run build)
        echo "tool-root=$tool_root" >> "$GITHUB_OUTPUT"
        node "$tool_root/dist/action/release-context-main.js" plan
