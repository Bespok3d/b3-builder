name: Bespok3d build
description: Build a repo of plugin dirs (or one plugin) into gated, class-aware .b3 files, release them, and register the assembled sub-list, over the one b3-builder core.
author: Bespok3d
branding:
  icon: package
  color: purple

# The one reusable CI face over the same publisher core the `b3-builder build` CLI runs (R5). A plugin
# repo pulls its whole pipeline from this Action instead of hand-copying a release.yml: build (bake the
# per-class payloads) then test then pack then release (a GitHub release + asset per plugin) then index
# (finalize each catalog entry's download_url with the real release URL) then register (reference the
# assembled sub-list in the index-of-lists). Publisher/org identity (atom-repo, list-name, list-publisher,
# the index-of-lists repo, and its token) arrives ONLY via inputs, never baked into this Action's logic:
# the tool is org-agnostic, the caller supplies who they are (THE HARD BOUNDARY, ADR-0041). A repo that
# passes NO list identity builds atoms-only: no sub-list is assembled or committed, and the finalized
# per-plugin atoms left in the out dir are what a downstream registration step publishes.
#
# Set publish=false for a PR or branch build: the pipeline still builds, tests, packs, and indexes, but
# cuts no release and registers nothing, so an unmerged branch produces the .b3 set as a downloadable
# artifact without publishing. Release stays main-only, gated by the caller's workflow trigger.
#
# Note on step order: the b3-builder pipeline bakes, packs, and indexes in one invocation, so "test" runs
# after pack rather than between build and pack. This is behavior-equivalent to the legacy build->test->pack
# order (pack only zips the already-baked tree, it never mutates it) and still gates the release: a failing
# test aborts before any release is cut, so no broken .b3 is ever published.

inputs:
  unit:
    description: repo (a repo of plugin dirs, assembled into a sub-list) or plugin (one plugin dir)
    required: false
    default: repo
  source:
    description: the source dir to build (a repo of plugin dirs, or one plugin dir), relative to the checkout
    required: false
    default: .
  out:
    description: output dir for the .b3 set and the built index, relative to the checkout
    required: false
    default: dist
  atom-repo:
    description: owner/repo slug each atom's doc_url points at (publisher identity, no baked default)
    required: true
  list-name:
    description: display name of the assembled sub-list (repo unit); leave BOTH this and list-publisher empty for an atoms-only repo
    required: false
  list-publisher:
    description: publisher of the assembled sub-list (repo unit); leave BOTH this and list-name empty for an atoms-only repo
    required: false
  list-ref-name:
    description: display name this sub-list is registered under in the index-of-lists (repo unit)
    required: false
  main-index-repo:
    description: owner/repo of the index-of-lists this sub-list registers into (repo unit; no baked default)
    required: false
  main-index-token:
    description: token with contents write on the index-of-lists repo; when empty the register step is skipped
    required: false
    default: ''
  signing-key:
    description: armored GPG private key to detach-sign each packed .b3; when empty the build is unsigned
    required: false
    default: ''
  exclude-dirs:
    description: space-separated immediate subdirs that hold a manifest.json but must never publish (a dev-only variant, e.g. fluidd-bleeding-edge); skipped by build discovery AND the release loop, no baked variant knowledge in the tool (ADR-0041)
    required: false
    default: ''
  provider-indexes:
    description: space-separated published index.json locations (a path or an http(s) URL) read for the services plugins in OTHER repos provide, so a require met elsewhere resolves to that plugin's id instead of stopping the build; WHICH indexes to trust is the caller's, never a baked default (ADR-0041)
    required: false
    default: ''
  bake:
    description: produce each plugin's payload from source via its declared bake class (CI-time only, ADR-0036)
    required: false
    default: 'false'
  skip-unchanged:
    description: reuse an existing .b3 whose fingerprint is unchanged instead of repacking
    required: false
    default: 'false'
  publish:
    description: release the built .b3 set (a GitHub release per plugin) and register the assembled sub-list; set to 'false' for a PR or branch build that only produces the .b3 files as artifacts
    required: false
    default: 'true'
  release-kind:
    description: draft, prerelease or live; non-live versions must end in -pre
    default: ''
  release-tag:
    description: Exact prospective tag bound into nonpublishing preparation evidence
    default: ''
  managed-release:
    description: Resolve tag or dispatch, stage sources, and issue or verify a prepared-run receipt
    default: 'false'
  manifest-path:
    description: Single-package manifest in the caller checkout; empty discovers plugin directories
    default: ''
  tag-prefix:
    description: Caller tag prefix, with {unit} replaced by the selected plugin name
    default: plugin-{unit}
  stage-command:
    description: Caller-owned staging command; empty stages discovered plugin directories
    default: ''
  expected-source-sha:
    description: Exact checkout commit required for a manual preparation or publication
    default: ''
  prepared-receipt:
    description: Approved preparation receipt for manual publication
    default: ''
  selected-ids:
    description: Space-separated unit IDs to publish; other units only supply build context
    required: true
  prepared-only:
    description: Publish previously prepared and verified outputs without rebuilding
    default: 'false'
  require-signature:
    description: Require valid package and evidence signatures before publication
    default: 'false'
  register-commit:
    description: Exact tested registration tooling commit
    required: true
  allow-empty-baseline:
    description: Explicit first Live sub-list publication, only when no Live release exists
    default: 'false'
  node-version:
    description: Node.js version the build and the pipeline run on
    required: false
    default: '24'

outputs:
  publish:
    description: Whether this run published the verified release
    value: ${{ steps.context.outputs.publish || inputs.publish }}
  selected-ids:
    description: The exact unit selected by this release
    value: ${{ steps.context.outputs.selected-ids || steps.selection.outputs.selected-ids }}
  release-kind:
    description: The resolved release tier
    value: ${{ steps.context.outputs.release-kind || steps.selection.outputs.release-kind }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Set up Docker buildx (for docker-c / docker-ko bakes)
      if: ${{ inputs.prepared-only != 'true' }}
      uses: docker/setup-buildx-action@v3

    - name: Expose the Actions layer cache to buildx
      if: ${{ inputs.prepared-only != 'true' }}
      uses: crazy-max/ghaction-github-runtime@v3

    - name: Build the b3-builder core
      shell: bash
      env:
        B3D_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        # dist/ and node_modules/ are gitignored, so a `uses:` checkout of this repo has neither. Build
        # from source once per run. (Committing dist or publishing to npm would remove this step; deferred.)
        cd "$B3D_ACTION_PATH"
        npm ci
        npm run build

    - name: Resolve the exact release or prepared artifact
      id: context
      if: ${{ inputs.managed-release == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        B3D_ACTION_PATH: ${{ github.action_path }}
        B3D_BUILDER_COMMIT: ${{ github.action_ref }}
        B3D_REGISTER_COMMIT: ${{ inputs.register-commit || github.action_ref }}
        B3D_MANIFEST_PATH: ${{ inputs.manifest-path }}
        B3D_TAG_PREFIX: ${{ inputs.tag-prefix }}
        B3D_PROSPECTIVE_TAG: ${{ inputs.release-tag }}
        B3D_SELECTED_IDS: ${{ inputs.selected-ids }}
        B3D_EXPECTED_SOURCE: ${{ inputs.expected-source-sha }}
        B3D_RELEASE_KIND: ${{ inputs.release-kind }}
        B3D_PUBLISH: ${{ inputs.publish }}
        B3D_PREPARED_RECEIPT: ${{ inputs.prepared-receipt }}
      run: node "$B3D_ACTION_PATH/dist/action/release-context-main.js" plan

    - name: Stage plugin source for exact preparation
      if: ${{ inputs.managed-release == 'true' && steps.context.outputs.prepared-only != 'true' && inputs.stage-command == '' }}
      shell: bash
      env:
        B3D_ACTION_PATH: ${{ github.action_path }}
      run: node "$B3D_ACTION_PATH/dist/action/release-context-main.js" stage-plugin-source

    - name: Stage caller-owned package source
      if: ${{ inputs.managed-release == 'true' && steps.context.outputs.prepared-only != 'true' && inputs.stage-command != '' }}
      shell: bash
      env:
        B3D_STAGE_COMMAND: ${{ inputs.stage-command }}
      run: bash -euo pipefail -c "$B3D_STAGE_COMMAND"

    - name: Download the exact prepared archive
      if: ${{ inputs.managed-release == 'true' && steps.context.outputs.prepared-only == 'true' }}
      uses: actions/download-artifact@v4
      with:
        artifact-ids: ${{ steps.context.outputs.prepared-artifact-id }}
        path: .
        merge-multiple: true
        run-id: ${{ steps.context.outputs.prepared-run-id }}
        github-token: ${{ github.token }}

    - name: Restore prepared bytes and file modes
      if: ${{ inputs.managed-release == 'true' && steps.context.outputs.prepared-only == 'true' }}
      shell: bash
      env:
        B3D_ACTION_PATH: ${{ github.action_path }}
      run: node "$B3D_ACTION_PATH/dist/action/release-context-main.js" restore

    - name: Resolve the selected tag and release kind
      id: selection
      if: ${{ inputs.managed-release != 'true' }}
      shell: bash
      env:
        B3D_ACTION_PATH: ${{ github.action_path }}
        B3D_ATOM_REPO: ${{ inputs.atom-repo }}
        B3D_UNIT: ${{ inputs.unit }}
        B3D_SOURCE: ${{ inputs.source }}
        B3D_OUT: ${{ inputs.out }}
        B3D_LIST_NAME: ${{ inputs.list-name }}
        B3D_LIST_PUBLISHER: ${{ inputs.list-publisher }}
        B3D_EXCLUDE_DIRS: ${{ inputs.exclude-dirs }}
        B3D_SELECTED_IDS: ${{ inputs.selected-ids }}
        B3D_RELEASE_KIND: ${{ inputs.release-kind }}
        B3D_PUBLISH: ${{ inputs.publish }}
        B3D_RELEASE_TAG: ${{ inputs.release-tag }}
      run: |
        set -euo pipefail
        if [ "$B3D_PUBLISH" = false ] && [ -z "$B3D_RELEASE_TAG" ]; then
          echo 'selected-ids=*' >> "$GITHUB_OUTPUT"
          echo 'release-kind=' >> "$GITHUB_OUTPUT"
          exit 0
        fi
        selection="$(node "$B3D_ACTION_PATH/dist/action/release-main.js" select)"
        echo "selected-ids=$(printf '%s' "$selection" | sed -n '1p')" >> "$GITHUB_OUTPUT"
        echo "release-kind=$(printf '%s' "$selection" | sed -n '2p')" >> "$GITHUB_OUTPUT"

    - name: Build and verify selected release outputs
      if: ${{ (inputs.managed-release == 'true' && steps.context.outputs.prepared-only != 'true') || (inputs.managed-release != 'true' && inputs.prepared-only != 'true' && (inputs.publish == 'true' || inputs.release-tag != '')) }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        B3D_ACTION_PATH: ${{ github.action_path }}
        B3D_ATOM_REPO: ${{ inputs.atom-repo }}
        B3D_UNIT: ${{ inputs.unit }}
        B3D_SOURCE: ${{ inputs.managed-release == 'true' && 'dist/package' || inputs.source }}
        B3D_OUT: ${{ inputs.out }}
        B3D_LIST_NAME: ${{ inputs.list-name }}
        B3D_LIST_PUBLISHER: ${{ inputs.list-publisher }}
        B3D_EXCLUDE_DIRS: ${{ inputs.exclude-dirs }}
        B3D_PROVIDER_INDEXES: ${{ inputs.provider-indexes }}
        B3D_SKIP_UNCHANGED: ${{ inputs.skip-unchanged }}
        B3D_BAKE: ${{ inputs.bake }}
        B3D_SIGNING_KEY: ${{ inputs.signing-key }}
        B3D_RELEASE_KIND: ${{ steps.context.outputs.release-kind || steps.selection.outputs.release-kind }}
        B3D_RELEASE_TAG: ${{ steps.context.outputs.release-tag || inputs.release-tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        B3D_PUBLISH: ${{ steps.context.outputs.publish || inputs.publish }}
        B3D_SELECTED_IDS: ${{ steps.context.outputs.selected-ids || steps.selection.outputs.selected-ids }}
        B3D_REQUIRE_SIGNATURE: ${{ inputs.require-signature }}
        B3D_BUILDER_COMMIT: ${{ github.action_ref }}
        B3D_REGISTER_COMMIT: ${{ inputs.register-commit || (inputs.managed-release == 'true' && github.action_ref) || '' }}
        B3D_ALLOW_EMPTY_BASELINE: ${{ inputs.allow-empty-baseline }}
        B3D_PREPARED_ONLY: ${{ inputs.prepared-only }}
        B3D_CACHE_ARGS: --cache-from type=gha --cache-to type=gha,mode=max,ignore-error=true
      run: |
        set -euo pipefail
        [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || { echo "checkout/source commit mismatch" >&2; exit 1; }
        [ -n "$B3D_SELECTED_IDS" ] || { echo "selected-ids must explicitly name units" >&2; exit 1; }
        node "$B3D_ACTION_PATH/dist/action/release-main.js" prepare

    - name: Build preview packages without publication
      if: ${{ inputs.managed-release != 'true' && inputs.publish == 'false' && inputs.release-tag == '' }}
      shell: bash
      env:
        B3D_ACTION_PATH: ${{ github.action_path }}
        B3D_ATOM_REPO: ${{ inputs.atom-repo }}
        B3D_UNIT: ${{ inputs.unit }}
        B3D_SOURCE: ${{ inputs.source }}
        B3D_OUT: ${{ inputs.out }}
        B3D_LIST_NAME: ${{ inputs.list-name }}
        B3D_LIST_PUBLISHER: ${{ inputs.list-publisher }}
        B3D_EXCLUDE_DIRS: ${{ inputs.exclude-dirs }}
        B3D_PROVIDER_INDEXES: ${{ inputs.provider-indexes }}
        B3D_SKIP_UNCHANGED: ${{ inputs.skip-unchanged }}
        B3D_BAKE: ${{ inputs.bake }}
      run: node "$B3D_ACTION_PATH/dist/action/release-main.js" preview

    - name: Test each plugin
      if: ${{ inputs.managed-release == 'true' && steps.context.outputs.prepared-only != 'true' || inputs.managed-release != 'true' && inputs.prepared-only != 'true' }}
      shell: bash
      env:
        B3D_ATOM_REPO: ${{ inputs.atom-repo }}
        B3D_UNIT: ${{ inputs.unit }}
        B3D_SOURCE: ${{ inputs.managed-release == 'true' && 'dist/package' || inputs.source }}
        B3D_SELECTED_IDS: ${{ steps.context.outputs.selected-ids || steps.selection.outputs.selected-ids }}
      run: |
        set -euo pipefail
        if [ "$B3D_UNIT" = "plugin" ]; then
          test_dirs=("${B3D_SOURCE%/}/")
        else
          test_dirs=("$B3D_SOURCE"/*/)
        fi
        for dir in "${test_dirs[@]}"; do
          [ -f "${dir}manifest.json" ] || continue
          unit_id="$(jq -r '.name' "${dir}manifest.json")"
          if [ "$B3D_SELECTED_IDS" != '*' ]; then
            case " $B3D_SELECTED_IDS " in
              *" $unit_id "*) ;;
              *) continue ;;
            esac
          fi
          [ -f "${dir}tests/run.sh" ] || continue
          sh "${dir}tests/run.sh"
        done

    - name: Publish exact verified outputs
      if: ${{ inputs.managed-release == 'true' && steps.context.outputs.publish == 'true' || inputs.managed-release != 'true' && inputs.publish == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        B3D_ACTION_PATH: ${{ github.action_path }}
        B3D_ATOM_REPO: ${{ inputs.atom-repo }}
        B3D_UNIT: ${{ inputs.unit }}
        B3D_SOURCE: ${{ inputs.managed-release == 'true' && 'dist/package' || inputs.source }}
        B3D_OUT: ${{ inputs.out }}
        B3D_LIST_NAME: ${{ inputs.list-name }}
        B3D_LIST_PUBLISHER: ${{ inputs.list-publisher }}
        B3D_EXCLUDE_DIRS: ${{ inputs.exclude-dirs }}
        B3D_PROVIDER_INDEXES: ${{ inputs.provider-indexes }}
        B3D_SKIP_UNCHANGED: ${{ inputs.skip-unchanged }}
        B3D_BAKE: ${{ inputs.bake }}
        B3D_SIGNING_KEY: ${{ inputs.signing-key }}
        B3D_RELEASE_KIND: ${{ steps.context.outputs.release-kind || steps.selection.outputs.release-kind }}
        B3D_RELEASE_TAG: ${{ steps.context.outputs.release-tag || inputs.release-tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        B3D_PUBLISH: ${{ steps.context.outputs.publish || inputs.publish }}
        B3D_SELECTED_IDS: ${{ steps.context.outputs.selected-ids || steps.selection.outputs.selected-ids }}
        B3D_REQUIRE_SIGNATURE: ${{ inputs.require-signature }}
        B3D_BUILDER_COMMIT: ${{ github.action_ref }}
        B3D_REGISTER_COMMIT: ${{ inputs.register-commit || (inputs.managed-release == 'true' && github.action_ref) || '' }}
        B3D_ALLOW_EMPTY_BASELINE: ${{ inputs.allow-empty-baseline }}
        B3D_PREPARED_ONLY: ${{ steps.context.outputs.prepared-only || inputs.prepared-only }}
        B3D_CACHE_ARGS: --cache-from type=gha --cache-to type=gha,mode=max,ignore-error=true
      run: |
        set -euo pipefail
        [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] || { echo "checkout/source commit mismatch" >&2; exit 1; }
        [ -n "$B3D_SELECTED_IDS" ] || { echo "selected-ids must explicitly name units" >&2; exit 1; }
        node "$B3D_ACTION_PATH/dist/action/release-main.js" publish

    - name: Register this sub-list in the index-of-lists (repo unit)
      if: ${{ inputs.unit == 'repo' && inputs.main-index-token != '' && inputs.list-name != '' && (steps.context.outputs.publish == 'true' || inputs.managed-release != 'true' && inputs.publish == 'true') && (steps.context.outputs.release-kind == 'live' || steps.selection.outputs.release-kind == 'live') }}
      shell: bash
      env:
        MAIN_INDEX_TOKEN: ${{ inputs.main-index-token }}
        MAIN_INDEX_REPO: ${{ inputs.main-index-repo }}
        LIST_REF_NAME: ${{ inputs.list-ref-name }}
      run: |
        set -euo pipefail
        [ -n "$MAIN_INDEX_REPO" ] || { echo "main-index-token was set but main-index-repo was not" >&2; exit 1; }
        [ -n "$LIST_REF_NAME" ] || { echo "main-index-token was set but list-ref-name was not (the ref needs a display name)" >&2; exit 1; }
        repo_name="${GITHUB_REPOSITORY##*/}"
        # The latest-release asset URL, never a per-release one: a per-release URL would change on every
        # release and move the churn this removed from the plugin repo into the index-of-lists instead.
        # What it registers is a NAME, not a fetchable address on its own: this repo, and the asset
        # called index.json on its newest release. A public repo serves that URL as it stands; a PRIVATE
        # one answers 404 on it for everyone, token or not, so a reader asks the host for the asset of
        # that name off the latest release instead. Both halves resolve to the same asset, which is what
        # lets one registered reference serve a public publisher and a private one alike.
        list_url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/index.json"
        workdir="$(mktemp -d)"
        # Full clone (no --depth 1) so a rebase on a concurrent push has the history it needs.
        # --branch main: the sub-list entry has to land on the branch the index is assembled and read
        # from, not on whatever the index repo's default branch happens to be.
        git clone --branch main "https://x-access-token:${MAIN_INDEX_TOKEN}@github.com/${MAIN_INDEX_REPO}.git" "$workdir"
        mkdir -p "$workdir/lists"
        jq -n --arg name "$LIST_REF_NAME" --arg url "$list_url" '{name: $name, url: $url}' \
          > "$workdir/lists/${repo_name}.json"
        cd "$workdir"
        git config user.name "bespok3d-bot"
        git config user.email "bot@bespok3d.local"
        git add "lists/${repo_name}.json"
        if git diff --cached --quiet; then
          echo "list reference unchanged; nothing to commit"
          exit 0
        fi
        git commit -m "register ${repo_name} sub-list"
        for attempt in 1 2 3 4 5; do
          git push && { echo "pushed ${MAIN_INDEX_REPO} (attempt ${attempt})"; exit 0; }
          [ "$attempt" = 5 ] && { echo "${MAIN_INDEX_REPO} push failed after ${attempt} attempts" >&2; exit 1; }
          echo "${MAIN_INDEX_REPO} push rejected; rebasing on remote (attempt ${attempt})"
          git pull --rebase --no-edit origin main
        done

    - name: Preserve verified file modes for later publication
      if: ${{ inputs.managed-release == 'true' && steps.context.outputs.publish == 'false' }}
      shell: bash
      run: tar -czf verified-unit-outputs.tar.gz dist

    - name: Keep the exact prepared archive
      id: prepared-artifact
      if: ${{ inputs.managed-release == 'true' && steps.context.outputs.publish == 'false' }}
      uses: actions/upload-artifact@v4
      with:
        name: verified-unit-outputs
        path: verified-unit-outputs.tar.gz
        if-no-files-found: error

    - name: Create the approval receipt
      if: ${{ inputs.managed-release == 'true' && steps.context.outputs.publish == 'false' }}
      shell: bash
      env:
        B3D_ACTION_PATH: ${{ github.action_path }}
        B3D_ARTIFACT_ID: ${{ steps.prepared-artifact.outputs.artifact-id }}
        B3D_ARTIFACT_DIGEST: ${{ steps.prepared-artifact.outputs.artifact-digest }}
      run: node "$B3D_ACTION_PATH/dist/action/release-context-main.js" receipt

    - name: Keep the receipt and annotated-tag message
      if: ${{ inputs.managed-release == 'true' && steps.context.outputs.publish == 'false' }}
      uses: actions/upload-artifact@v4
      with:
        name: verified-unit-receipt
        path: |
          prepared-release-receipt.json
          prepared-release-tag-message.txt
        if-no-files-found: error
