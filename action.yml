name: Bespok3d build
description: Build a repo of plugin dirs (or one plugin) into gated, class-aware .b3 files, release them, and register the assembled sub-list, over the one b3-builder core.
author: Bespok3d
branding:
  icon: package
  color: purple

# The one reusable CI face over the same publisher core the `b3-builder build` CLI runs (R5). A plugin
# repo pulls its whole pipeline from this Action instead of hand-copying a release.yml: build (bake the
# per-class payloads) then test then pack then release (a GitHub release + asset per plugin) then index
# (finalize each catalog entry's download_url with the real release URL) then register (reference the
# assembled sub-list in the index-of-lists). Publisher/org identity (atom-repo, list-name, list-publisher,
# the index-of-lists repo, and its token) arrives ONLY via inputs, never baked into this Action's logic:
# the tool is org-agnostic, the caller supplies who they are (THE HARD BOUNDARY, ADR-0041). A repo that
# passes NO list identity builds atoms-only: no sub-list is assembled or committed, and the finalized
# per-plugin atoms left in the out dir are what a downstream registration step publishes.
#
# Set publish=false for a PR or branch build: the pipeline still builds, tests, packs, and indexes, but
# cuts no release and registers nothing, so an unmerged branch produces the .b3 set as a downloadable
# artifact without publishing. Release stays main-only, gated by the caller's workflow trigger.
#
# Note on step order: the b3-builder pipeline bakes, packs, and indexes in one invocation, so "test" runs
# after pack rather than between build and pack. This is behavior-equivalent to the legacy build->test->pack
# order (pack only zips the already-baked tree, it never mutates it) and still gates the release: a failing
# test aborts before any release is cut, so no broken .b3 is ever published.

inputs:
  unit:
    description: repo (a repo of plugin dirs, assembled into a sub-list) or plugin (one plugin dir)
    required: false
    default: repo
  source:
    description: the source dir to build (a repo of plugin dirs, or one plugin dir), relative to the checkout
    required: false
    default: .
  out:
    description: output dir for the .b3 set and the built index, relative to the checkout
    required: false
    default: dist
  atom-repo:
    description: owner/repo slug each atom's doc_url points at (publisher identity, no baked default)
    required: true
  list-name:
    description: display name of the assembled sub-list (repo unit); leave BOTH this and list-publisher empty for an atoms-only repo
    required: false
  list-publisher:
    description: publisher of the assembled sub-list (repo unit); leave BOTH this and list-name empty for an atoms-only repo
    required: false
  list-ref-name:
    description: display name this sub-list is registered under in the index-of-lists (repo unit)
    required: false
  main-index-repo:
    description: owner/repo of the index-of-lists this sub-list registers into (repo unit; no baked default)
    required: false
  main-index-token:
    description: token with contents write on the index-of-lists repo; when empty the register step is skipped
    required: false
    default: ''
  exclude-dirs:
    description: space-separated immediate subdirs that hold a manifest.json but must never publish (a dev-only variant, e.g. fluidd-bleeding-edge); skipped by build discovery AND the release loop, no baked variant knowledge in the tool (ADR-0041)
    required: false
    default: ''
  bake:
    description: produce each plugin's payload from source via its declared bake class (CI-time only, ADR-0036)
    required: false
    default: 'false'
  skip-unchanged:
    description: reuse an existing .b3 whose fingerprint is unchanged instead of repacking
    required: false
    default: 'false'
  publish:
    description: release the built .b3 set (a GitHub release per plugin) and register the assembled sub-list; set to 'false' for a PR or branch build that only produces the .b3 files as artifacts
    required: false
    default: 'true'
  node-version:
    description: Node.js version the build and the pipeline run on
    required: false
    default: '20'

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Set up Docker buildx (for docker-c / docker-ko bakes)
      uses: docker/setup-buildx-action@v3

    - name: Expose the Actions layer cache to buildx
      uses: crazy-max/ghaction-github-runtime@v3

    - name: Build the b3-builder core
      shell: bash
      env:
        B3D_ACTION_PATH: ${{ github.action_path }}
      run: |
        set -euo pipefail
        # dist/ and node_modules/ are gitignored, so a `uses:` checkout of this repo has neither. Build
        # from source once per run. (Committing dist or publishing to npm would remove this step; deferred.)
        cd "$B3D_ACTION_PATH"
        npm ci
        npm run build

    - name: Build, pack, and index every plugin
      shell: bash
      env:
        B3D_ACTION_PATH: ${{ github.action_path }}
        B3D_UNIT: ${{ inputs.unit }}
        B3D_SOURCE: ${{ inputs.source }}
        B3D_OUT: ${{ inputs.out }}
        B3D_ATOM_REPO: ${{ inputs.atom-repo }}
        B3D_LIST_NAME: ${{ inputs.list-name }}
        B3D_LIST_PUBLISHER: ${{ inputs.list-publisher }}
        B3D_EXCLUDE_DIRS: ${{ inputs.exclude-dirs }}
        B3D_BAKE: ${{ inputs.bake }}
        B3D_SKIP_UNCHANGED: ${{ inputs.skip-unchanged }}
        # Only the docker bakes read this; unset it and a plain build is unaffected (docker-image cacheArgs).
        B3D_CACHE_ARGS: --cache-from type=gha --cache-to type=gha,mode=max
      run: |
        set -euo pipefail
        args=(build --unit "$B3D_UNIT" --source "$B3D_SOURCE" --out "$B3D_OUT" --atom-repo "$B3D_ATOM_REPO")
        [ -n "$B3D_LIST_NAME" ] && args+=(--list-name "$B3D_LIST_NAME")
        [ -n "$B3D_LIST_PUBLISHER" ] && args+=(--list-publisher "$B3D_LIST_PUBLISHER")
        for excluded in $B3D_EXCLUDE_DIRS; do args+=(--exclude "$excluded"); done
        [ "$B3D_BAKE" = "true" ] && args+=(--bake)
        [ "$B3D_SKIP_UNCHANGED" = "true" ] && args+=(--skip-unchanged)
        node "$B3D_ACTION_PATH/dist/cli/main.js" "${args[@]}"

    - name: Test each plugin (a plugin with tests ships tests/run.sh)
      shell: bash
      env:
        B3D_SOURCE: ${{ inputs.source }}
      run: |
        set -euo pipefail
        for dir in "$B3D_SOURCE"/*/; do
          [ -f "${dir}tests/run.sh" ] || continue
          echo "Running ${dir}tests/run.sh"
          sh "${dir}tests/run.sh"
        done

    - name: Release each plugin and collect its asset URL
      if: ${{ inputs.publish == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        B3D_SOURCE: ${{ inputs.source }}
        B3D_OUT: ${{ inputs.out }}
        B3D_EXCLUDE_DIRS: ${{ inputs.exclude-dirs }}
      run: |
        set -euo pipefail
        url_map="$(mktemp)"
        echo '{}' > "$url_map"
        for dir in "$B3D_SOURCE"/*/; do
          [ -f "${dir}manifest.json" ] || continue
          base=$(basename "$dir")
          skip=""
          for excluded in $B3D_EXCLUDE_DIRS; do [ "$base" = "$excluded" ] && skip=1; done
          [ -n "$skip" ] && { echo "Skipped excluded dir ${base} (never publishes)"; continue; }
          # A collection (kind:collection) is install-orchestration metadata with no payload, so pack
          # never produces a .b3 for it and there is nothing to release.
          [ "$(jq -r '.kind // "plugin"' "${dir}manifest.json")" = "collection" ] && { echo "Skipped collection ${base} (no packed asset by design)"; continue; }
          name=$(jq -r '.name' "${dir}manifest.json")
          version=$(jq -r '.version' "${dir}manifest.json")
          tag="${name}-v${version}"
          asset="${name}-${version}.b3"
          [ -f "$B3D_OUT/$asset" ] || { echo "missing packed asset $B3D_OUT/$asset" >&2; exit 1; }
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --notes "Automated release of ${asset}"
          fi
          gh release upload "$tag" "$B3D_OUT/$asset" --clobber
          # The asset's API URL (.url, not browser_download_url) is what the app fetches with a bearer
          # token + Accept: application/octet-stream, which works for private repos and public alike.
          asset_url=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
            --jq ".assets[] | select(.name==\"${asset}\") | .url")
          [ -n "$asset_url" ] || { echo "no asset URL for $asset after upload" >&2; exit 1; }
          tmp=$(mktemp)
          jq --arg fn "$asset" --arg url "$asset_url" '. + {($fn): $url}' "$url_map" > "$tmp" && mv "$tmp" "$url_map"
        done
        echo "B3D_URL_MAP=$url_map" >> "$GITHUB_ENV"

    - name: Finalize atom download_urls with the release asset URLs (repo unit)
      if: ${{ inputs.unit == 'repo' && inputs.publish == 'true' }}
      shell: bash
      env:
        B3D_ACTION_PATH: ${{ github.action_path }}
        B3D_OUT: ${{ inputs.out }}
      run: |
        set -euo pipefail
        node "$B3D_ACTION_PATH/dist/action/finalize-atom-urls.js" "$B3D_OUT" "$B3D_URL_MAP"

    - name: Finalize index.json download_urls with the release asset URLs (repo unit)
      if: ${{ inputs.unit == 'repo' && inputs.list-name != '' && inputs.publish == 'true' }}
      shell: bash
      env:
        B3D_ACTION_PATH: ${{ github.action_path }}
        B3D_SOURCE: ${{ inputs.source }}
        B3D_OUT: ${{ inputs.out }}
      run: |
        set -euo pipefail
        node "$B3D_ACTION_PATH/dist/action/inject-release-urls.js" \
          "$B3D_OUT/index.json" "$B3D_URL_MAP" "$B3D_SOURCE/index.json"

    - name: Commit the assembled index.json (repo unit)
      if: ${{ inputs.unit == 'repo' && inputs.list-name != '' && inputs.publish == 'true' }}
      shell: bash
      env:
        B3D_SOURCE: ${{ inputs.source }}
      run: |
        set -euo pipefail
        cd "$B3D_SOURCE"
        git config user.name "bespok3d-bot"
        git config user.email "bot@bespok3d.local"
        git add index.json
        if git diff --cached --quiet; then
          echo "index unchanged; nothing to commit"
          exit 0
        fi
        git commit -m "assemble sub-list index.json"
        for attempt in 1 2 3 4 5; do
          git push && { echo "pushed index.json (attempt ${attempt})"; exit 0; }
          [ "$attempt" = 5 ] && { echo "index.json push failed after ${attempt} attempts" >&2; exit 1; }
          echo "index.json push rejected; rebasing on remote (attempt ${attempt})"
          git pull --rebase --no-edit
        done

    - name: Register this sub-list in the index-of-lists (repo unit)
      if: ${{ inputs.unit == 'repo' && inputs.main-index-token != '' && inputs.list-name != '' && inputs.publish == 'true' }}
      shell: bash
      env:
        MAIN_INDEX_TOKEN: ${{ inputs.main-index-token }}
        MAIN_INDEX_REPO: ${{ inputs.main-index-repo }}
        LIST_REF_NAME: ${{ inputs.list-ref-name }}
      run: |
        set -euo pipefail
        [ -n "$MAIN_INDEX_REPO" ] || { echo "main-index-token was set but main-index-repo was not" >&2; exit 1; }
        [ -n "$LIST_REF_NAME" ] || { echo "main-index-token was set but list-ref-name was not (the ref needs a display name)" >&2; exit 1; }
        repo_name="${GITHUB_REPOSITORY##*/}"
        # github: ref (not a raw.githubusercontent URL): the app fetches sub-lists via the authenticated
        # GitHub API, which works for private repos and public alike. Raw URLs 404 on private repos.
        list_url="github:${GITHUB_REPOSITORY}/index.json"
        workdir="$(mktemp -d)"
        # Full clone (no --depth 1) so a rebase on a concurrent push has the history it needs.
        git clone "https://x-access-token:${MAIN_INDEX_TOKEN}@github.com/${MAIN_INDEX_REPO}.git" "$workdir"
        mkdir -p "$workdir/lists"
        jq -n --arg name "$LIST_REF_NAME" --arg url "$list_url" '{name: $name, url: $url}' \
          > "$workdir/lists/${repo_name}.json"
        cd "$workdir"
        git config user.name "bespok3d-bot"
        git config user.email "bot@bespok3d.local"
        git add "lists/${repo_name}.json"
        if git diff --cached --quiet; then
          echo "list reference unchanged; nothing to commit"
          exit 0
        fi
        git commit -m "register ${repo_name} sub-list"
        for attempt in 1 2 3 4 5; do
          git push && { echo "pushed ${MAIN_INDEX_REPO} (attempt ${attempt})"; exit 0; }
          [ "$attempt" = 5 ] && { echo "${MAIN_INDEX_REPO} push failed after ${attempt} attempts" >&2; exit 1; }
          echo "${MAIN_INDEX_REPO} push rejected; rebasing on remote (attempt ${attempt})"
          git pull --rebase --no-edit origin main
        done
